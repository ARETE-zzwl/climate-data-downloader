[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-data-downloader"
version = "0.1.0"
description = "Multi-source climate data desktop downloader and package organizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "certifi>=2024.2",
  "numpy>=1.24",
  "scipy>=1.10",
  "xarray>=2023.1",
  "netCDF4>=1.6",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
climatedl = "cmip_downloader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
